[package]
name = "valkyrie"
version = "0.9.9"
edition = "2021"
description = "Valkyrie — the LieraOS file manager"
license = "GPL-3.0-or-later"
authors = ["Jörg Schröder, LieraOS Project <projekt@lieraos.local>"]
homepage = "https://lieraos.local"
repository = ""

[dependencies]
gtk4 = { version = "0.9", package = "gtk4", features = ["v4_10"] }
glib = "0.20"
gio = { version = "0.20", features = ["v2_70"] }
gettext-rs = "0.8"
libc = "0.2.177"
blake3 = "1.8.2"
vte4 = "0.8"
pangocairo = "0.20"
cairo-rs = "0.20"

[profile.release]
lto = true
opt-level = 3

[package.metadata.deb]
revision = "0"
maintainer = "LieraOS Project <projekt@lieraos.local>"
section = "x11"
priority = "optional"
depends = "$auto, gvfs, gvfs-backends, gvfs-daemons, libsecret-common, p7zip-full, file-roller, poppler-utils, ffmpegthumbnailer"
recommends = "ffmpegthumbnailer"
assets = [
    ["target/release/valkyrie", "usr/bin/valkyrie", "755"],
    ["data/org.lieraos.valkyrie.desktop", "usr/share/applications/", "644"],
    ["data/org.lieraos.valkyrie.gschema.xml", "usr/share/glib-2.0/schemas/", "644"],
    ["data/icons/valkyrie.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["Theme/Valkyrie/**/*", "usr/share/icons/Valkyrie/", "644"],
    ["target/locale/de/LC_MESSAGES/valkyrie.mo", "usr/share/locale/de/LC_MESSAGES/valkyrie.mo", "644"],
    ["target/locale/en/LC_MESSAGES/valkyrie.mo", "usr/share/locale/en/LC_MESSAGES/valkyrie.mo", "644"],
]
